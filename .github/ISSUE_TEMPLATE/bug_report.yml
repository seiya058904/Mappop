name: Bug report
description: Help us reproduce a problem in Mappop.
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the route, theme, and a small non-sensitive example if relevant.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: "Chrome 142, Windows 11"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove private map content, access tokens, and other secrets before posting.
