name: Verify and deploy Mappop

on:
  push:
    branches: [main]
    # Documentation never reaches the deployed site; skip the full pipeline for it.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mappop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Browser tests dominate CI time, so they run as parallel shards. Each shard has
  # its own build, local D1 and wrangler server; no state is shared between shards.
  verify:
    name: Verify (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            simple-mind-map/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund && npm run setup
      - name: API and validation tests
        if: matrix.shard == 1
        run: npm test
      - name: Build the original Vue editor and Mappop extensions
        run: npm run build
      - name: Keep the tested build for deployment
        if: matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: .output/public/
          retention-days: 1
      - name: Prepare local D1 and browser
        run: |
          printf '%s\n' 'MAPPOP_API_TOKEN=mappop-ci-fixture-not-a-production-secret' > .dev.vars
          npm run db:local
          npx playwright install --with-deps chromium
      - name: Desktop and mobile regression tests
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deployment tooling
        run: npm ci --no-audit --no-fund
      - name: Restore the tested build
        uses: actions/download-artifact@v4
        with:
          name: site
          path: .output/public/
      - name: Apply production schema and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:remote && npx wrangler deploy
