name: Verify and deploy Mappop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mappop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            simple-mind-map/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund && npm run setup
      - name: API and validation tests
        run: npm test
      - name: Build the original Vue editor and Mappop extensions
        run: npm run build
      - name: Prepare local D1 and browser
        run: |
          printf '%s\n' 'MAPPOP_API_TOKEN=mappop-ci-fixture-not-a-production-secret' > .dev.vars
          npm run db:local
          npx playwright install --with-deps chromium
      - name: Desktop and mobile regression tests
        run: npm run test:e2e
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 7
      - name: Apply production schema and deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:remote && npx wrangler deploy
